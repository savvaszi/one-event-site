name: Translation drafts

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package*.json'
      - 'scripts/*translation*'
      - '.github/workflows/translation-drafts.yml'

permissions:
  contents: read

concurrency:
  group: translation-drafts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: candidate
          persist-credentials: false

      - name: Check out the base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            baseline/package-lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Build both revisions
        run: |
          npm --prefix baseline ci --no-audit --no-fund
          npm --prefix baseline run build
          npm --prefix candidate ci --no-audit --no-fund
          npm --prefix candidate run build

      - name: Generate Greek and Spanish drafts
        run: |
          python -m unittest discover -s candidate/scripts -p 'test_translation_drafts.py'
          python -m pip install --only-binary=:all: -r candidate/scripts/translation-requirements.txt
          python candidate/scripts/translation_drafts.py \
            --before baseline/dist --after candidate/dist \
            --output "$RUNNER_TEMP/translation-drafts.md" \
            --model-cache "$RUNNER_TEMP/translation-models"

      - name: Upload review document
        id: report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: translation-drafts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/translation-drafts.md
          if-no-files-found: error
          retention-days: 30

      - name: Link the draft in the run summary
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          printf '[Download the Greek and Spanish translation drafts](%s)\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
