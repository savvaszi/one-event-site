server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = /api/inquiry-assistant {
        client_max_body_size 16k;
        proxy_read_timeout 15s;
        proxy_pass http://127.0.0.1:4322;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
